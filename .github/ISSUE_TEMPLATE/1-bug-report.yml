name: 🐞 버그 제보
description: 세브렌 AI를 쓰다가 발견한 문제를 알려주세요.
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        시간 내어 제보해주셔서 감사합니다!
        아래 항목을 채워주시면 훨씬 빠르게 해결할 수 있어요.
        전부 채우지 않으셔도 괜찮습니다.
        ⚠️ 비밀번호, 개인정보 등 민감한 내용은 적지 말아주세요.
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요?
      description: 어떤 문제가 발생했는지 편하게 적어주세요.
      placeholder: 예) 음성 녹음을 마치고 저장 버튼을 눌렀는데 아무 반응이 없어요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 어떤 순서로 하면 이 문제가 다시 나타나나요?
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대했던 결과
      description: 원래는 어떻게 동작해야 한다고 생각하셨나요?
    validations:
      required: false
  - type: dropdown
    id: device
    attributes:
      label: 사용 기기
      options:
        - iPhone (iOS)
        - Android 폰
        - Mac
        - Windows PC
        - 기타
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: 브라우저 / 앱 버전
      placeholder: 예) Chrome 최신 / 세브렌 앱 1.0.2
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷 또는 영상
      description: 이미지 파일을 이 칸에 그대로 끌어다 놓으면 업로드됩니다.
    validations:
      required: false
  - type: input
    id: frequency
    attributes:
      label: 얼마나 자주 발생하나요?
      placeholder: 예) 매번 / 가끔 (하루 1~2회) / 딱 한 번
    validations:
      required: false
